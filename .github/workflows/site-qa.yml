name: Sales page browser QA
on:
  push:
    paths: ['docs/**', '.github/workflows/site-qa.yml', 'tests/site-qa.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/site-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-page-screenshots
          path: qa-output/
          retention-days: 7
